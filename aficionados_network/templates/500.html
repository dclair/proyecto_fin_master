<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error del Servidor (500) | Hubs & Clicks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f8faf9;
            color: #2b3e34;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .error-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 10px 30px rgba(11, 89, 97, 0.08);
            max-width: 550px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
        }
        .text-hubs {
            color: #0b5961;
        }
        .btn-hubs {
            background-color: #0b5961;
            border-color: #0b5961;
            color: #ffffff;
            font-weight: 600;
        }
        .btn-hubs:hover {
            background-color: #084349;
            border-color: #084349;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="mb-3">
            <span class="display-2 fw-bold text-hubs">500</span>
            <div class="mt-1">
                <i class="bi bi-flower1 fs-1 text-hubs"></i>
            </div>
        </div>
        <h1 class="h4 fw-bold mb-3">Algo inesperado ha ocurrido</h1>
        <p class="text-muted mb-4">
            Nuestro equipo técnico ha sido notificado automáticamente y estamos trabajando para restaurar el servicio a la normalidad lo antes posible.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="/" class="btn btn-hubs px-4 py-2 rounded-pill shadow-sm">
                <i class="bi bi-house-door-fill me-1"></i> Ir al Inicio
            </a>
            <a href="/contact/" class="btn btn-outline-secondary px-4 py-2 rounded-pill">
                <i class="bi bi-envelope me-1"></i> Contacto
            </a>
        </div>
    </div>
</body>
</html>
