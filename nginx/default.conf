upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name 141.148.227.48 localhost; # Reemplazar con dominio si aplica en el futuro

    client_max_body_size 20M; # Permitir subida de imágenes pesadas en el chat

    # Sirve los archivos estáticos desde el volumen compartido
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Sirve los archivos multimedia subidos por usuarios
    location /media/ {
        alias /app/media/;
    }

    # Pasa el tráfico de WebSockets a Daphne
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
    }

    # Pasa todo el resto del tráfico HTTP normal a Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        # Si configuras SSL en el futuro, Nginx debe avisarle a Django:
        # proxy_set_header X-Forwarded-Proto $scheme;
    }
}
