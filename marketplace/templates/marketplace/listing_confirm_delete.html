{% extends "general/layout.html" %}

{% block title %}Eliminar Anuncio | Mercadillo{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 border-top border-danger border-3">
                <div class="card-body p-4 text-center">
                    <i class="fas fa-exclamation-triangle text-danger fa-4x mb-3"></i>
                    <h2 class="h4 mb-3">¿Estás seguro de eliminar este anuncio?</h2>
                    <p class="text-muted mb-4">
                        Vas a eliminar permanentemente el anuncio <strong>"{{ object.title }}"</strong>. Esta acción no se puede deshacer.
                    </p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'marketplace:listing_detail' object.slug %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-danger px-4">Sí, Eliminar Permanentemente</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
